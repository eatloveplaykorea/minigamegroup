<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두더지 잡기</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --text: #1f2933; --muted: #6b7785;
    --cell: #c9d3df; --cell-hover: #b8c4d3; --open: #f7f9fb; --border: #d5dce4;
    --accent: #3b6fd8; --good: #2f9e44; --boom: #e5484d;
    --ground: #8a6a4b; --hole: #3d2c1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181d; --panel: #1f242b; --text: #e6e9ee; --muted: #8d97a3;
      --cell: #3a434f; --cell-hover: #46515f; --open: #262c34; --border: #333b46;
      --accent: #6b98f0; --good: #55c06a; --boom: #f06464;
      --ground: #5c4632; --hole: #1d150e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 24px 16px;
  }
  .home { align-self: flex-start; color: var(--muted); text-decoration: none; font-size: 0.95rem; margin-bottom: 8px; }
  .home:hover { color: var(--accent); }
  h1 { margin: 0 0 16px; font-size: 1.6rem; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .game { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; width: 100%; max-width: 400px; }
  .status {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    margin-bottom: 10px; font-variant-numeric: tabular-nums; font-size: 1.1rem; font-weight: 600;
  }
  .bar { height: 8px; border-radius: 4px; background: var(--open); border: 1px solid var(--border); overflow: hidden; margin-bottom: 12px; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width .2s linear; }
  .field {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    background: var(--ground); border-radius: 10px; padding: 12px;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .hole {
    position: relative; aspect-ratio: 1; border: 0; padding: 0; cursor: pointer;
    background: radial-gradient(ellipse 70% 30% at 50% 78%, var(--hole) 96%, transparent 100%);
    overflow: hidden; border-radius: 12px;
  }
  .hole span {
    position: absolute; left: 50%; bottom: 14%; font-size: clamp(2.4rem, 13vw, 3.6rem); line-height: 1;
    transform: translate(-50%, 110%); transition: transform .12s ease-out;
  }
  .hole.up span { transform: translate(-50%, 0); }
  .hole.hit span { filter: grayscale(1) brightness(.8); }
  .hole .pop {
    position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
    font-weight: 800; font-size: 1.1rem; color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none;
    animation: rise .5s ease-out forwards;
  }
  @keyframes rise { to { transform: translate(-50%, -14px); opacity: 0; } }
  .start {
    display: block; width: 100%; margin-top: 12px; padding: 12px; border-radius: 10px;
    border: 0; background: var(--accent); color: #fff; font-size: 1.1rem; font-weight: 700; cursor: pointer;
  }
  .start:disabled { opacity: .45; cursor: default; }
  .message { min-height: 1.5em; margin-top: 10px; font-weight: 600; text-align: center; }
  .help { color: var(--muted); font-size: 0.9rem; margin-top: 14px; text-align: center; line-height: 1.6; }
  @media (prefers-reduced-motion: reduce) { .hole span, .bar i { transition: none; } .hole .pop { animation: none; } }
</style>
</head>
<body>
  <a class="home" href="index.html">← 게임 모음</a>
  <h1>🔨 두더지 잡기</h1>

  <div class="game">
    <div class="status">
      <span id="score">점수 0</span>
      <span id="time">⏱ 30초</span>
      <span id="best">최고 0</span>
    </div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <div class="field" id="field"></div>
    <button class="start" id="start">시작하기</button>
  </div>

  <div class="message" id="message" role="status"></div>
  <div class="help">
    30초 동안 튀어나오는 두더지를 클릭(탭)하세요. 시간이 갈수록 빨라집니다.<br>
    🐹 +1점 · 🌟 황금 두더지 +3점 · 💣 폭탄을 누르면 −2점
  </div>

<script>
const DURATION = 30;
const fieldEl = document.getElementById('field');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const bestEl = document.getElementById('best');
const barEl = document.getElementById('bar');
const startBtn = document.getElementById('start');
const msgEl = document.getElementById('message');

const holes = [];
let score = 0, running = false, endAt = 0, spawnTimer = null, clockTimer = null;

function readBest() { try { return Number(localStorage.getItem('mole-best')) || 0; } catch (e) { return 0; } }

for (let i = 0; i < 9; i++) {
  const el = document.createElement('button');
  el.className = 'hole';
  el.setAttribute('aria-label', `구멍 ${i + 1}`);
  el.innerHTML = '<span></span>';
  fieldEl.appendChild(el);
  holes.push({ el, kind: null, timer: null });
}
bestEl.textContent = '최고 ' + readBest();

function progress() { return 1 - Math.max(0, endAt - Date.now()) / (DURATION * 1000); } // 0 → 1

function spawn() {
  if (!running) return;
  const free = holes.filter(h => !h.kind);
  if (free.length) {
    const h = free[Math.floor(Math.random() * free.length)];
    const r = Math.random();
    h.kind = r < 0.1 ? 'gold' : r < 0.22 ? 'bomb' : 'mole';
    h.el.querySelector('span').textContent = { mole: '🐹', gold: '🌟', bomb: '💣' }[h.kind];
    h.el.classList.remove('hit');
    h.el.classList.add('up');
    const stay = 1100 - progress() * 550; // 1.1s → 0.55s
    h.timer = setTimeout(() => hide(h), stay);
  }
  spawnTimer = setTimeout(spawn, 750 - progress() * 400 + Math.random() * 200);
}

function hide(h) {
  clearTimeout(h.timer);
  h.el.classList.remove('up');
  h.kind = null;
}

function popText(h, text) {
  const p = document.createElement('span');
  p.className = 'pop'; p.textContent = text;
  h.el.appendChild(p);
  setTimeout(() => p.remove(), 500);
}

function whack(h) {
  if (!running || !h.kind || h.el.classList.contains('hit')) return;
  const pts = { mole: 1, gold: 3, bomb: -2 }[h.kind];
  score = Math.max(0, score + pts);
  scoreEl.textContent = '점수 ' + score;
  popText(h, pts > 0 ? '+' + pts : String(pts));
  h.el.classList.add('hit');
  clearTimeout(h.timer);
  h.timer = setTimeout(() => hide(h), 180);
  if (pts < 0 && navigator.vibrate) navigator.vibrate(60);
}

function start() {
  score = 0; running = true; endAt = Date.now() + DURATION * 1000;
  scoreEl.textContent = '점수 0'; msgEl.textContent = '';
  startBtn.disabled = true; startBtn.textContent = '진행 중…';
  holes.forEach(hide);
  clockTimer = setInterval(updateClock, 100);
  updateClock();
  spawn();
}

function updateClock() {
  const left = Math.max(0, endAt - Date.now());
  timeEl.textContent = '⏱ ' + Math.ceil(left / 1000) + '초';
  barEl.style.width = (left / (DURATION * 1000) * 100) + '%';
  if (left <= 0) finish();
}

function finish() {
  running = false;
  clearInterval(clockTimer); clearTimeout(spawnTimer);
  holes.forEach(hide);
  const best = readBest();
  let msg = `⏰ 끝! 점수 ${score}점`;
  if (score > best) {
    try { localStorage.setItem('mole-best', score); } catch (e) {}
    bestEl.textContent = '최고 ' + score;
    msg += ' (최고 기록!)';
  } else msg += ` · 최고 기록: ${best}점`;
  msgEl.textContent = msg;
  startBtn.disabled = false; startBtn.textContent = '다시 하기';
}

// pointerdown feels faster than click for a reflex game
fieldEl.addEventListener('pointerdown', e => {
  const el = e.target.closest('.hole');
  if (el) { e.preventDefault(); whack(holes.find(h => h.el === el)); }
});
fieldEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('.hole');
  if (el) { e.preventDefault(); whack(holes.find(h => h.el === el)); }
});
startBtn.addEventListener('click', start);
</script>
</body>
</html>
